<!doctype html>
<html dir="rtl" lang="fa" class="dark" style="background: #08090d">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.json" />
    <link
      rel="preload"
      href="%VITE_APP_FONT_BASE_URL%/vazirmatn/Vazirmatn-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fafbfc"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#08090d"
    />
    <meta
      name="description"
      content="با پرپیکس ایده‌ات رو به عکس یا ویدیو تبدیل کن. مدل موردنظرت رو انتخاب کن و ساختش رو شروع کن."
    />
    <style>
      @font-face {
        font-family: "Vazirmatn";
        src: url("%VITE_APP_FONT_BASE_URL%/vazirmatn/Vazirmatn-Thin.woff2")
          format("woff2");
        font-weight: 100;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Vazirmatn";
        src: url("%VITE_APP_FONT_BASE_URL%/vazirmatn/Vazirmatn-ExtraLight.woff2")
          format("woff2");
        font-weight: 200;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Vazirmatn";
        src: url("%VITE_APP_FONT_BASE_URL%/vazirmatn/Vazirmatn-Light.woff2")
          format("woff2");
        font-weight: 300;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Vazirmatn";
        src: url("%VITE_APP_FONT_BASE_URL%/vazirmatn/Vazirmatn-Regular.woff2")
          format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Vazirmatn";
        src: url("%VITE_APP_FONT_BASE_URL%/vazirmatn/Vazirmatn-Medium.woff2")
          format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Vazirmatn";
        src: url("%VITE_APP_FONT_BASE_URL%/vazirmatn/Vazirmatn-SemiBold.woff2")
          format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Vazirmatn";
        src: url("%VITE_APP_FONT_BASE_URL%/vazirmatn/Vazirmatn-Bold.woff2")
          format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Vazirmatn";
        src: url("%VITE_APP_FONT_BASE_URL%/vazirmatn/Vazirmatn-ExtraBold.woff2")
          format("woff2");
        font-weight: 800;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Vazirmatn";
        src: url("%VITE_APP_FONT_BASE_URL%/vazirmatn/Vazirmatn-Black.woff2")
          format("woff2");
        font-weight: 900;
        font-style: normal;
        font-display: swap;
      }

      /* First-frame splash; React's boot splash takes over with the same look. */
      .boot-static {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60% 70% at 12% 50%, rgb(224 43 214 / 26%), transparent 70%),
          radial-gradient(60% 70% at 88% 50%, rgb(45 123 255 / 28%), transparent 70%),
          #08090d;
      }
    </style>
    <title>PerPix</title>
  </head>
  <body>
    <div id="root" translate="no">
      <div class="boot-static" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
