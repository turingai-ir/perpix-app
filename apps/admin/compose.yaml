x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  perpix-admin-panel:
    image: perpix-admin-panel:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PERPIX_ADMIN_PORT:-5175}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 128m
    cpus: "0.20"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped
    pull_policy: build
    networks:
      - perpix

networks:
  perpix:
    external: true
